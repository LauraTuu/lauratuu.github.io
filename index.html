<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; }
    canvas { display: block; }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
    

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1, 3);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('canvas'),
      antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const rgbeLoader = new RGBELoader();
    rgbeLoader.load('ferndale_studio_04_1k.hdr', (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = texture;
      scene.background = texture;
    });

  const glassMaterialR = new THREE.MeshPhysicalMaterial({
  transmission: 1,
  thickness: 2,
  roughness: 0,
  ior: 1.45, // red bends least
  transparent: true,
  color: new THREE.Color(1, 0, 0),
});

const glassMaterialG = new THREE.MeshPhysicalMaterial({
  transmission: 1,
  thickness: 2,
  roughness: 0,
  ior: 1.50, // green in the middle
  transparent: true,
  color: new THREE.Color(0, 1, 0),
});

const glassMaterialB = new THREE.MeshPhysicalMaterial({
  transmission: 1,
  thickness: 2,
  roughness: 0,
  ior: 1.55, // blue bends most
  transparent: true,
  color: new THREE.Color(0, 0, 1),
});

    const loader = new GLTFLoader();
    
    loader.load('chromehorse.glb', (gltf) => {
  const materials = [glassMaterialR, glassMaterialG, glassMaterialB];

  materials.forEach((mat) => {
    const clone = gltf.scene.clone(true);
    clone.traverse((child) => {
      if (child.isMesh) {
        child.geometry.computeVertexNormals();
        child.material = mat;
        mat.blending = THREE.AdditiveBlending; // combines the RGB layers
        mat.depthWrite = false;
      }
    });
    scene.add(clone);
  });
});



    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
